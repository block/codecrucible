schema_version: 1
name: cerebras
protocol: openai-chat
base_url: https://api.cerebras.ai
auto_detect_priority: 40
require_model: true
warn_unpriced: true
auth:
  type: bearer
  api_key_env: CEREBRAS_API_KEY
request:
  path: /v1/chat/completions
  max_tokens_field: max_completion_tokens
discovery:
  format: openai-models
  path: /v1/models

models:
  # Provisional planning assumptions for this model, not provider
  # pricing. Keep existing unknown-model sizing/capability defaults until
  # the deployment's actual limits are verified. JSON Schema was live-tested.
  - name: "kimi-k2.6"
    endpoint: "kimi-k2.6/invocations"
    input_price_per_million: 2.0
    output_price_per_million: 8.0
    context_limit: 128000
    max_output_tokens: 8192
    tokenizer_encoding: "cl100k_base"
    execution_warning: "kimi-k2.6 uses provisional planning rates of $2/M input and $8/M output, not verified Cerebras contract prices; 128K context and 8192 output are fallback limits. Override models: with verified deployment settings. Cost limits use these assumed rates and cannot guarantee actual billed spend"
    supports_structured_output: true
    aliases: [kimi, kimi-k2, "kimi k2.6"]
  # Opt-in public profile. Keep deployment IDs in local model-params.
  # JSON Schema was verified on one deployment; other deployments must
  # explicitly select this profile or configure their own capabilities.
  # Upstream specifies a 1M context and 128K output. Cerebras defaults
  # reasoning_effort to max; keep deployment-specific routing in config.
  - name: "zai-glm-5.3-flash"
    exact_match: true
    endpoint: "zai-glm-5.3-flash/invocations"
    context_limit: 1048576
    max_output_tokens: 131072
    tokenizer_encoding: "cl100k_base"
    execution_warning: "zai-glm-5.3-flash uses upstream 1M context and 128K output limits; Cerebras deployment limits may differ and contract pricing is unverified. Override models: with deployment-specific settings"
    supports_structured_output: true
